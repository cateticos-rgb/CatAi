<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CateticAI Control Panel</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; }
    h2 { color: #ff5500; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
    button { width: 48%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-preview { background: #444; color: #fff; }
    .btn-post { background: #ff5500; color: #fff; }
    #preview-box { display: none; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px dashed #555; margin-top: 15px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>

  <h2>🐾 CateticAI Control Panel</h2>

  <label>API Key:</label>
  <input type="password" id="apiKey" placeholder="Paste your Moltbook API Key here...">

  <label>Submolt:</label>
  <input type="text" id="submolt" value="funnylifeofagents">

  <label>Title:</label>
  <input type="text" id="title" placeholder="Enter post title...">

  <label>Content / ASCII Art:</label>
  <textarea id="content" rows="6" placeholder="Type your text or paste ASCII art here..."></textarea>

  <div style="display: flex; justify-content: space-between;">
    <button class="btn-preview" onclick="showPreview()">👁️ Preview</button>
    <button class="btn-post" onclick="sendPost()">🚀 Post Now</button>
  </div>

  <div id="preview-box"></div>
  <p id="status-log" style="color: #ffaa00; font-weight: bold;"></p>

  <script>
    function showPreview() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const box = document.getElementById('preview-box');
      box.style.display = 'block';
      box.innerText = `[PREVIEW]\nTitle: ${title}\n\n${content}`;
    }

    function solveMathChallenge(text) {
      const wordMap = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19, twenty:20, thirty:30, forty:40, fifty:50 };
      const clean = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
      const tokens = clean.split(/\s+/);
      let numbers = [];
      let isSubtract = clean.includes('slows') || clean.includes('decrease') || clean.includes('subtract') || clean.includes('minus') || clean.includes('less');

      for (let token of tokens) {
        if (!isNaN(token) && token !== '') numbers.push(parseFloat(token));
        else if (wordMap[token] !== undefined) numbers.push(wordMap[token]);
      }

      if (numbers.length >= 2) {
        const result = isSubtract ? numbers[0] - numbers[1] : numbers[0] + numbers[1];
        return result.toFixed(2);
      }
      return "0.00";
    }

    async function sendPost() {
      const status = document.getElementById('status-log');
      const apiKey = document.getElementById('apiKey').value.trim();
      const submolt = document.getElementById('submolt').value.trim();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value;

      if (!apiKey || !title || !content) {
        status.innerText = "❌ Please fill out all fields including API Key!";
        return;
      }

      status.innerText = "Sending to Moltbook...";

      try {
        const headers = { 
          'Content-Type': 'application/json', 
          'Authorization': `Bearer ${apiKey}` 
        };

        const postRes = await fetch('https://www.moltbook.com/api/v1/posts', {
          method: 'POST',
          headers,
          body: JSON.stringify({ submolt, title, content })
        });

        const postData = await postRes.json();
        
        if (!postRes.ok) {
          status.innerText = `❌ Error: ${postData.message || 'Failed to post'}`;
          return;
        }

        const verification = postData.post?.verification || postData.verification;
        if (verification) {
          status.innerText = "Solving verification challenge...";
          const answer = solveMathChallenge(verification.challenge_text);
          
          await fetch('https://www.moltbook.com/api/v1/verify', {
            method: 'POST',
            headers,
            body: JSON.stringify({ verification_code: verification.verification_code, answer })
          });
        }

        status.innerText = "Post Sent & Verified Successfully! 😸";
      } catch (err) {
        status.innerText = `❌ Request failed: ${err.message}`;
      }
    }
  </script>

</body>
</html>
